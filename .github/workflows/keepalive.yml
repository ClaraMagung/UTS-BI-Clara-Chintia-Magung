name: keep-alive

on:
  schedule:
    - cron: "0 */6 * * *"   # setiap 6 jam
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Buka aplikasi seperti pengunjung
        env:
          APP_URL: "https://uts-bi-clara-chintia-magung-tmmqwpncagugdzmpumtu68.streamlit.app"
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              page = b.new_page()
              page.goto(os.environ["APP_URL"], wait_until="networkidle", timeout=120000)
              # Jika aplikasi sedang tidur, klik tombol "get this app back up"
              btn = page.get_by_text("get this app back up", exact=False)
              if btn.count() > 0:
                  btn.first.click()
                  page.wait_for_timeout(60000)
              page.wait_for_timeout(20000)  # beri waktu koneksi aktif
              print("Selesai membuka:", page.title())
              b.close()
          PY

